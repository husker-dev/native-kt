[versions]

# == Kotlin ==
kotlin = "2.4.20"
kotlin_serialization = "1.11.0"
kotlin_coroutines = "1.11.0"
kotlin_benchmark = "0.5.0"
kotlinx_io = "0.9.1"

# == Android ==
android_plugin = "9.4.1"
# noinspection GradleDependency
android_test_runner = "1.2.0" # old versions to allow testing on SDK < 21
# noinspection GradleDependency
android_test_juint = "1.1.5"  # old versions to allow testing on SDK < 21

# == Tools ==
intellij_platform = "2.19.0"
webidl = "1.1.2"
stdlibx = "2.0.0"
shadow = "9.6.1"
proguard = "0.9.0"

# == Other FFI gen ==
gobley = "0.3.7"

# == Publish ==
gradle_plugin_publish = "2.2.1"
maven_publish = "0.37.0"

[libraries]

kotlinx-coroutines      = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin_coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlin_coroutines" }
kotlinx-benchmark       = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlin_benchmark" }
kotlinx-serialization   = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlin_serialization" }
kotlin-gradle-plugin    = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

android-gradle          = { module = "com.android.tools.build:gradle", version.ref = "android_plugin" }
androidx-test-runner    = { module = "androidx.test:runner", version.ref = "android_test_runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "android_test_juint" }

webidl                  = { module = "com.huskerdev:webidl-kt", version.ref = "webidl" }
stdlibx                 = { module = "com.huskerdev:stdlibx", version.ref = "stdlibx" }
stdlibx-fs              = { module = "com.huskerdev:stdlibx-fs", version.ref = "stdlibx" }
stdlibx-process         = { module = "com.huskerdev:stdlibx-process", version.ref = "stdlibx" }

[plugins]

kotlin-multiplatform         = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm                   = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-js                    = { id = "org.jetbrains.kotlin.js", version.ref = "kotlin" }
kotlin-android               = { id = "com.android.kotlin.multiplatform.library", version.ref = "android_plugin" }
kotlin-serialization         = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-atomicfu              = { id = "org.jetbrains.kotlin.plugin.atomicfu", version.ref = "kotlin" }
kotlinx-benchmark            = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlin_benchmark" }

intellij-platform            = { id = "org.jetbrains.intellij.platform", version.ref = "intellij_platform" }

gobley-cargo                 = { id = "dev.gobley.cargo", version.ref = "gobley" }
gobley-uniffy                = { id = "dev.gobley.uniffi", version.ref = "gobley" }

shadow                       = { id = "com.gradleup.shadow", version.ref = "shadow" }
proguard                     = { id = "io.github.sgtsilvio.gradle.proguard", version.ref = "proguard" }
plugin-publish               = { id = "com.gradle.plugin-publish", version.ref = "gradle_plugin_publish" }
maven-publish                = { id = "com.vanniktech.maven.publish", version.ref = "maven_publish" }