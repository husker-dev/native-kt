name: Publish (Cargo)
on: workflow_dispatch
jobs:
  cargo:
    name: Publish (Cargo)
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: "Prepare"
        run: |
          chmod +x ./gradlew

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'graalvm'
          java-version: 25
          
      - name: Pack Cargo package
        run: ./gradlew :modules:cli:packCargoPackage

      - name: Publish Cargo package
        uses: katyo/publish-crates@v2
        with:
          path: './modules/cli/build/nativekt-cargo'
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
