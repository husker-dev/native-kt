name: Tests

env:
  EM_VERSION: 5.0.3

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    
jobs:
  test:
    name: Kotlin/Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
            emsdk-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}-emsdk-${{ env.EM_VERSION }}

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        env:
          MSYS2_LOCATION: 'C:\msys64'
        with:
          msystem: clang64
          install: mingw-w64-clang-x86_64-clang

      - name: Check PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo $env:PATH
          
      - name: Setup MSYS2 (env)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "C:/msys64/clang64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo $env:PATH
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'graalvm'
          java-version: '25'

      - name: Check PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo $env:PATH

      - name: Setup Emscripten (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          ./emsdk_env
          
      - name: Setup Emscripten (Unix)
        if: runner.os != 'Windows'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh

      - name: Check PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo $env:PATH

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.2'
      
      - name: Run Native tests (Linux x64)
        if: runner.os == 'Linux'
        run: ./gradlew :tests:linuxX64Test --continue

      - name: Run Native tests (macOS arm64)
        if: runner.os == 'macOS'
        run: ./gradlew :tests:macosArm64Test --continue

      - name: Run Native tests (Windows x64)
        if: runner.os == 'Windows'
        run: ./gradlew :tests:mingwX64Test --continue

      - name: Test Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: "**/build/test-results/**/TEST-*.xml"
          show: "all"
