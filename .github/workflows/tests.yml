name: Tests

env:
  EM_VERSION: 5.0.3

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    
jobs:
  test:
    name: Kotlin/Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
            emsdk-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}-emsdk-${{ env.EM_VERSION }}
      
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          location: D:\
          msystem: clang64
          install: mingw-w64-clang-x86_64-clang
          
      - name: Setup MSYS2 (env)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "D:\msys64\clang64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'graalvm'
          java-version: '25'

      - name: Setup Emscripten (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest --permanent
          echo "EMSDK=$env:EMSDK" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
      - name: Setup Emscripten (Unix)
        if: runner.os != 'Windows'
        run: |
          cd $HOME
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source "$HOME/emsdk/emsdk_env.sh"
          echo "EMSDK=$EMSDK" >> $GITHUB_ENV

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.2'

      - name: Enable KVM
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      
          
      - name: Kotlin/Android tests
        if: runner.os == 'Linux'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          arch: x86_64
          target: google_apis
          script: ./gradlew :tests:connectedAndroidTest
          
      - name: Kotlin/Native tests (Linux x64)
        if: runner.os == 'Linux'
        run: ./gradlew :tests:linuxX64Test --continue

      - name: Kotlin/Native tests (macOS arm64)
        if: runner.os == 'macOS'
        run: ./gradlew :tests:macosArm64Test --continue

      - name: Kotlin/Native tests (Windows x64)
        if: runner.os == 'Windows'
        run: ./gradlew :tests:mingwX64Test --continue

      - name: Kotlin/JS tests
        if: runner.os == 'Windows'
        run: ./gradlew :tests:jsTest --continue

      - name: Kotlin/Wasm tests
        if: runner.os == 'Windows'
        run: ./gradlew :tests:wasmJsTest --continue

      - name: Kotlin/JVM tests (Linux x64)
        if: runner.os == 'Linux'
        run: |
          ./gradlew :tests:jvmTest --continue
          ./gradlew :tests:jvmTest -DdisableForeign --continue

      - name: Kotlin/JVM tests (macOS arm64)
        if: runner.os == 'macOS'
        run: |
          ./gradlew :tests:jvmTest --continue
          ./gradlew :tests:jvmTest -DdisableForeign --continue

      - name: Kotlin/JVM tests (Windows x64)
        if: runner.os == 'Windows'
        run: |
          ./gradlew :tests:jvmTest --continue
          ./gradlew :tests:jvmTest -DdisableForeign --continue

      - name: Test Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: "**/build/test-results/**/TEST-*.xml"
          show: "all"
