# $scheme:nativekt

[description]
name = "tc_3_cpp"
api_file = "../../tc_3.ndl"

[cmake]
project_dir = "."
library_name = "tc_3_cpp"
language = "cpp"

[kotlin]
package = "natives.tc_3_cpp"
use_coroutines = true

[jvm]
use_records = true
backends = ["jni", "foreign", "jvmci"]

[js]
use_bigint = true
target = "web"

[android]
ndk_version = "latest"
sdk_version = "23"
abis = ["arm64-v8a", "armeabi-v7a", "x86_64"]
critical_natives = true

[apple]
min_ios = "15.0"
min_macos = "12.0"
min_tvos = "15.0"
min_watchos = "9.0"

[compilation]
common_target = "common"
targets = [
    "jvm",
    "android",

    "js",
    "wasmJs",

    "mingwX64",

    "macosArm64",
    "macosX64",

    "linuxArm64",
    "linuxX64",

    "iosArm64",
    "iosX64",
    "iosSimulatorArm64",

    "watchosX64",
    "watchosArm32",
    "watchosArm64",
    "watchosDeviceArm64",
    "watchosSimulatorArm64",

    "tvosX64",
    "tvosArm64",
    "tvosSimulatorArm64",

    "androidNativeX64",
    "androidNativeX86",
    "androidNativeArm32",
    "androidNativeArm64"
]
stubs = []