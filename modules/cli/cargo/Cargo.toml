[package]
name = "nativekt"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Native-Kt Rust integration"
license = "Apache-2.0"
repository = "https://github.com/husker-dev/native-kt"
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]
keywords = ["nativekt", "kotlin", "kmp"]

[features]
default = []
macro = ["dep:nativekt-macros"]
build = ["dep:nativekt-build"]
bundled = ["build", "nativekt-build/bundled"]

[dependencies]
wasm-bindgen = "~0.2.128"
nativekt-macros = {
    version = "0.1.0",
    path = "nativekt-macros",
    optional = true
}
nativekt-build = {
    version = "0.1.0",
    path = "nativekt-build",
    optional = true,
    default-features = false
}

[workspace]
members = ["nativekt-build", "nativekt-macros"]
resolver = "3"
