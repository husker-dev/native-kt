# $scheme:nativekt

[description]
name = "glfwBindings"
api_file = "./api.ndl"

# stub
[cmake]
project_dir = "."
library_name = "glfwBindings"
language = "c"

[kotlin]
package = "natives.glfwBindings"
use_coroutines = false

[jvm]
use_records = true
backends = ["jni", "foreign", "jvmci"]

[apple]
min_ios = "15.0"
min_macos = "12.0"
min_tvos = "15.0"
min_watchos = "9.0"

[compilation]
common_target = "common"
targets = [
    "jvm",

    "mingwX64",

    "macosArm64",
    "macosX64",

    "linuxArm64",
    "linuxX64",
]
stubs = []