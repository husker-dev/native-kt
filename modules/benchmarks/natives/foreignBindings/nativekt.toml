# $scheme:nativekt

[description]
name = "foreignBindings"
api_file = "./api.ndl"

[cargo]
project_dir = "./"
profile = "release"

[kotlin]
package = "natives.foreignBindings"
use_coroutines = true

[jvm]
use_records = true
backends = ["foreign"]

[js]
use_bigint = true
target = "web"

[android]
ndk_version = "latest"
abis = ["arm64-v8a", "armeabi-v7a", "x86_64"]
critical_natives = true

[compilation]
common_target = "jvm"
targets = [
    "jvm",
]
stubs = []