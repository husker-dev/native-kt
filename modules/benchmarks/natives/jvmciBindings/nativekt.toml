# $scheme:nativekt

[description]
name = "jvmciBindings"
api_file = "./api.ndl"

[cargo]
project_dir = "."
lib_name = "jvmci_bindings"
profile = "release"

[kotlin]
package = "natives.jvmciBindings"
use_coroutines = true

[jvm]
use_records = true
backends = ["jvmci"]

[js]
use_bigint = true
target = "web"

[android]
ndk_version = "latest"
sdk_version = "23"
abis = ["arm64-v8a", "armeabi-v7a", "x86_64"]
critical_natives = true

[apple]
min_ios = "15.0"
min_macos = "12.0"
min_tvos = "15.0"
min_watchos = "9.0"

[compilation]
common_target = "jvm"
targets = [
    "jvm",
]
stubs = []