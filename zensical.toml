[project]
site_name = "native-kt"
site_url = "https://husker-dev.github.io/native-kt/"
site_description = "Gradle plugin for convenient C/C++ integration into a Kotlin Multiplatform project."
site_author = "Nikita Shtengauer"
repo_url = "https://github.com/husker-dev/native-kt"
repo_name = "husker-dev/native-kt"
nav = [
    {"Home" = "index.md"},
    {"Documentation" = [
        {"Overview" = "overview.md"},
        {"Project" = [
            {"Requirements" = "requirements.md"},
            {"Gradle configuration" = "project_configuration.md"},
            {"Natives declaration" = "natives_declaration.md"},
        ]},
        {"Code" = [
            {"NDL file" = "ndl_file.md"},
            {"Kotlin code" = "kotlin_file.md"},
            {"C header" = "c_header.md"}
        ]},
        {"Details" = [
            {"Memory model" = "memory_model.md"},
            {"Critical" = "critical.md"},
            {"Publishing" = "publishing.md"},
        ]},
    ]},
    {"Example" = "example.md"}
]

# Theme colors
[project.theme]
logo = "images/logo-rect.svg"
favicon = "images/logo-rect.png"
language = "en"
features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.sections",
    "navigation.path",
    "navigation.footer",
    "toc.follow",
    "content.code.copy"
]

# Default theme
[project.theme.palette]
scheme = "slate"
primary = "indigo"
accent = "amber"
