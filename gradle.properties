
kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.enableKlibsCrossCompilation=false
kotlin.native.ignoreDisabledTargets=true
kotlin.native.jvmArgs=--enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow

# gradle
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=true

# AGP falsely warns that commonTest exists but android host tests are not enabled,
# even though commonTest is consumed by android device tests.
android.sync.suppressAgpWarnings=GENERIC
android.suppressUnsupportedOptionWarnings=android.sync.suppressAgpWarnings

# POM
pom.url=https://github.com/husker-dev/native-kt
pom.licenses.name=The Apache License, Version 2.0
pom.licenses.url=http://www.apache.org/licenses/LICENSE-2.0.txt
pom.developer.id=husker-dev
pom.developer.name=Nikita Shtengauer
pom.developer.email=shtengauer.nikita@gmail.com
pom.scm.connection=https://github.com/husker-dev/native-kt.git

# Type 1 to enable mavenLocal()
mavenLocal=